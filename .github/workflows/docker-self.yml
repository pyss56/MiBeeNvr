name: Build Self Docker Image

# Fork-local image build: publishes ghcr.io/pyss56/mibeenvr on every push to
# main/dev, plus manual dispatch. Kept as a separate file (not merged into
# upstream's release.yml) so upstream syncs stay conflict-free.
#
# - push main        -> latest + <version>
# - push dev         -> dev
# - workflow_dispatch -> dev (with a `tag` input override)
#
# Credentials: prefers a PAT in secrets.GHCR_TOKEN (fork packages are often
# not linked to the source repo, so GITHUB_TOKEN alone hits write_package),
# falling back to GITHUB_TOKEN if no PAT is configured.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to publish (optional), e.g. test or v0.14.1'
        required: false
        type: string

concurrency:
  group: docker-self-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mibeenvr

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # need tags/history for git describe

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Resolve version and tags
        id: ver
        env:
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Version: fork-local VERSION file wins (4-part fork numbering,
          # e.g. v0.15.0.1), then an exact tag, then v<short-sha>.
          # The file is fork-only; upstream syncs never touch it, and bumping
          # the build number is a one-line edit here (no tag push, which would
          # wake upstream's release.yml).
          VER=""
          if [ -f VERSION ]; then VER=$(tr -d ' \t\r\n' < VERSION); fi
          [ -n "$VER" ] || VER=$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || echo "")
          [ -n "$VER" ] || VER="v$(git rev-parse --short=12 HEAD)"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

          BRANCH="${GITHUB_REF_NAME}"
          TAGS="${REGISTRY}/${IMAGE_NAME}:${VER}"
          if [ "$BRANCH" = "main" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:latest"
          else
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${BRANCH}"
          fi
          if [ -n "$EXTRA_TAG" ]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE_NAME}:${EXTRA_TAG}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS}"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.ver.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=docker-self
          cache-to: type=gha,scope=docker-self,mode=max
          # Attestations add empty manifest entries rejected by some mirrors.
          provenance: false
          sbom: false
